# El proyecto de Xcode no se guarda: lo genera XcodeGen en el Mac de GitHub Actions (.github/workflows/ios.yml).
name: Nana
options:
  bundleIdPrefix: dev.yagotg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  Nana:
    type: application
    platform: iOS
    sources:
      - Nana
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yagotg.nana
        INFOPLIST_FILE: Nana/Info.plist
        CODE_SIGN_ENTITLEMENTS: Nana/Nana.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
